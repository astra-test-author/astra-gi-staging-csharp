schema = 1

[integration]                      # metadata: shown to the user, never acted on
id = "astra-test-author.gi-staging-csharp"
name = "Staging C# Test GI"
version = "0.1.3"
authors = ["astra-test-author"]
license = "MIT"
repo = "https://github.com/astra-test-author/astra-gi-staging-csharp"

# manifest.md §2.2: a name this install's own [[game_files]]/[launch] places or touches must be
# labelled here, or gi-probe's real check refuses with loader-undeclared -- found by actually
# running it (CLAUDE.md "test the thing"): astra-lethal's own astra-gi.toml places winhttp.dll the
# same way and carries no [integration.loader] table either, so it would hit the same finding if
# re-ingested today.
[integration.loader]
proxies = ["winhttp.dll"]

[target]                           # which game: Lethal Company (Unity Mono), the same game
steam_appid = 1966720              # astra-lethal (first-party) targets, for the staging rehearsal
exe = "Lethal Company.exe"         # relative to the game folder
platforms = ["windows-x64", "linux-proton"]
anti_cheat = "none"

# Into the PROFILE (Astra's own folder for this game; never the game folder).
[[files]]
from = "BepInEx/core/**"           # paths inside the zip; ** = everything below
to = "${profile}/BepInEx/core/"

[[files]]
from = "BepInEx/plugins/**"        # the foundation (Astra/) AND this integration (AstraGiStagingCsharp/)
to = "${profile}/BepInEx/plugins/"

# Beside the game's exe — the only files that touch the game folder. Each one is on the consent
# sheet, pinned by its digest, backed up if it replaces a game file and restored on uninstall.
[[game_files]]
from = "winhttp.dll"               # Doorstop's proxy: BepInEx_win_x64_5.4.23.5.zip, unmodified
to = "${game}/winhttp.dll"
sha256 = "8c6cdbc38836dee87e3368f5de1994d7c0ccebf29e4ce7aba3c0981f9375412c"

[[game_files]]
from = "doorstop_config.ini"       # ships with enabled = false: Steam's own Play stays vanilla
to = "${game}/doorstop_config.ini"

[launch]
args = ["--doorstop-enabled", "true",
        "--doorstop-target-assembly", "${profile}/BepInEx/core/BepInEx.Preloader.dll"]
proton_dll_overrides = { winhttp = "native,builtin" }
